<nav class="side w-100 h-100 d-flex flex-column">
  <div class="d-flex flex-column align-items-center text-center p-4 side-perfil">
    <div class="d-flex align-items-center justify-content-center">
      @if (photoUrl) {
        <img class="rounded-circle border" width="48" height="48" [src]="photoUrl" alt="Foto de perfil" />
      } @else {
        <mat-icon style="font-size: 48px; width: 48px; height: 48px;">account_circle</mat-icon>
      }
    </div>
    <div class="mt-2">
      <div class="fw-semibold text-wrap text-break text-center" style="max-width: 200px;">{{ displayName }}</div>
      @if (cargoName || puestoName) {
        <span class="small badge badge-pill bg-color d-inline-block text-wrap text-break text-center" style="max-width: 200px; white-space: normal;">{{ cargoName || puestoName }}</span>
      }
    </div>
  </div>

  <!-- Menú agrupado: Operación / Servicios / Catálogos / Pagos -->
  <div class="side-menu">
    @for (grupo of gruposVisibles; track grupo.titulo) {
      <div class="side-grupo">{{ grupo.titulo }}</div>
      @for (item of grupo.items; track item.key) {
        <a class="side-item" [routerLink]="item.path" routerLinkActive="active">
          <i class="bi bi-{{ item.icon }}"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    }
  </div>
</nav>
