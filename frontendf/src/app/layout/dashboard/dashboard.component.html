<div class="dashboard-container">
  <app-navbar [sidebarVisible]="sidebarVisible" (toggleSidebar)="toggleSidebar()"></app-navbar>
  <div class="dashboard-content" [class.is-mobile]="isMobile">
    <!-- Fondo oscuro: solo en móvil cuando el menú está abierto; al tocarlo cierra -->
    <div class="sidebar-backdrop" *ngIf="isMobile && sidebarVisible" (click)="toggleSidebar()"></div>
    <div class="sidebar-wrapper" [class.collapsed]="!sidebarVisible">
      <app-sidebar *ngIf="sidebarVisible" (click)="cerrarEnMovil()"></app-sidebar>
    </div>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
