<h2 mat-dialog-title>{{ esEdicion ? 'Editar tarifa' : 'Nueva tarifa' }}</h2>

<mat-dialog-content>
  <div class="mb-2">
    <label class="form-label mb-0 small">Tipo de servicio</label>
    <input type="text" class="form-control form-control-sm" [(ngModel)]="row.tipo_servicio"
           list="tiposDlg" placeholder="ej. Guardias fijos">
    <datalist id="tiposDlg">
      <option *ngFor="let t of tipos" [value]="t"></option>
    </datalist>
  </div>

  <div class="row g-2">
    <div class="col-6">
      <label class="form-label mb-0 small">Horas desde</label>
      <input type="number" min="1" class="form-control form-control-sm text-center" [(ngModel)]="row.horas_min">
    </div>
    <div class="col-6">
      <label class="form-label mb-0 small">Horas hasta</label>
      <input type="number" min="1" class="form-control form-control-sm text-center" [(ngModel)]="row.horas_max">
    </div>
  </div>

  <div class="mt-2">
    <label class="form-label mb-0 small">Valor</label>
    <input type="number" step="0.01" min="0" class="form-control form-control-sm text-end" [(ngModel)]="row.valor">
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
