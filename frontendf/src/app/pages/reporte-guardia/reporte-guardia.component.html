<div class="container-fluid px-0">
  <h3 class="mb-3 text-center">Reporte de Guardia</h3>

  <div class="d-flex align-items-center mb-3">
    <div class="flex-grow-1" style="flex-basis:0;">
      <input type="date" lang="es" class="form-control form-control-sm w-auto"
             [value]="filtroFecha" (change)="onFechaChange($event)">
    </div>
    <div class="flex-grow-1 d-flex justify-content-center" style="flex-basis:0;">
      <mat-button-toggle-group [(ngModel)]="filtroTurno" (change)="cargar()" aria-label="Turno">
        <mat-button-toggle value="Diurno">Diurno</mat-button-toggle>
        <mat-button-toggle value="Nocturno">Nocturno</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <div class="flex-grow-1" style="flex-basis:0;"></div>
  </div>

  <div *ngFor="let s of secciones" class="mb-4">
    <h5 class="border-bottom pb-1 fw-bold d-flex align-items-center justify-content-center gap-2">
      <span>{{ s.label }}</span>
      <button *ngIf="esManual(s.key)" type="button"
              class="btn btn-sm btn-outline-primary py-0 px-2"
              (click)="crearManual(s.key)" [title]="'Agregar ' + s.label">
        <i class="bi bi-plus-lg"></i>
      </button>
    </h5>
    <div class="table-responsive">
    <table class="table table-bordered table-sm align-middle text-center">
      <thead class="table-light">
        <tr>
          <th style="width:40px">Nº</th>
          <th *ngFor="let c of s.cols">{{ etiquetas[c] }}</th>
          <th *ngIf="editablesDe(s.key).length" style="width:80px">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of filasDe(s.key); let i = index">
          <td>{{ i + 1 }}</td>
          <td *ngFor="let c of s.cols">{{ celda(f, c) }}</td>
          <td *ngIf="editablesDe(s.key).length">
            <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2"
                    (click)="editar(f)" title="Editar">
              <i class="bi bi-pencil"></i>
            </button>
            <button *ngIf="esManual(s.key)" type="button"
                    class="btn btn-sm btn-outline-danger py-0 px-2 ms-1"
                    (click)="eliminar(f)" title="Eliminar">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="!filasDe(s.key).length">
          <td [attr.colspan]="s.cols.length + 1 + (editablesDe(s.key).length ? 1 : 0)" class="text-center text-muted">Sin registros.</td>
        </tr>
        <tr *ngIf="s.total && filasDe(s.key).length" class="fw-bold table-light">
          <td [attr.colspan]="s.cols.length">Total</td>
          <td>{{ totalValor(s.key).toFixed(2) }}</td>
          <td *ngIf="editablesDe(s.key).length"></td>
        </tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
