<h2 mat-dialog-title>{{ titulo }}</h2>

<mat-dialog-content class="apoyo-form">
  <mat-form-field appearance="outline">
    <mat-label>Cliente</mat-label>
    <input type="text" matInput [formControl]="clienteCtrl" [matAutocomplete]="autoCli"
           placeholder="Escribe para filtrar cliente…">
    <mat-autocomplete #autoCli="matAutocomplete" [displayWith]="displayCliente"
                      (optionSelected)="onClienteSel($event.option.value)">
      <mat-option *ngFor="let c of clientesFiltrados()" [value]="c">{{ c.nombre_comercial }}</mat-option>
      <mat-option disabled *ngIf="!clientesFiltrados().length">Sin coincidencias</mat-option>
    </mat-autocomplete>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Instalación</mat-label>
    <input type="text" matInput [formControl]="instalacionCtrl" [matAutocomplete]="autoInst"
           [readonly]="!clienteId" placeholder="Escribe para filtrar instalación…">
    <mat-autocomplete #autoInst="matAutocomplete" [displayWith]="displayInstalacion"
                      (optionSelected)="onInstalacionSel($event.option.value)">
      <mat-option *ngFor="let i of instalacionesFiltradas()" [value]="i">
        {{ i.nombre }}<span *ngIf="i.codigo"> ({{ i.codigo }})</span>
      </mat-option>
      <mat-option disabled *ngIf="clienteId && !instalacionesFiltradas().length">Sin coincidencias</mat-option>
    </mat-autocomplete>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Puesto</mat-label>
    <input type="text" matInput [formControl]="puestoCtrl" [matAutocomplete]="autoPue"
           [readonly]="!instalacionId" placeholder="Escribe para filtrar puesto…">
    <mat-autocomplete #autoPue="matAutocomplete" [displayWith]="displayPuesto"
                      (optionSelected)="onPuestoSel($event.option.value)">
      <mat-option *ngFor="let p of puestosFiltrados()" [value]="p">{{ p.nombre }}</mat-option>
      <mat-option disabled *ngIf="instalacionId && !puestosFiltrados().length">Sin coincidencias</mat-option>
    </mat-autocomplete>
  </mat-form-field>

  <mat-form-field appearance="outline" *ngIf="muestra('persona_nombre')">
    <mat-label>Nombre y apellidos</mat-label>
    <input type="text" matInput [formControl]="personaCtrl" [matAutocomplete]="auto"
           placeholder="Selecciona o escribe para filtrar…">
    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayPersona"
                      (optionSelected)="onPersonaSel($event.option.value)">
      <mat-option *ngFor="let p of personasFiltradas$ | async" [value]="p">
        {{ p.nombres }} {{ p.apellidos }} <small class="text-muted">— {{ p.cedula }}</small>
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>

  <mat-form-field appearance="outline" *ngIf="muestra('proviene')">
    <mat-label>Proviene (tipo)</mat-label>
    <input matInput [value]="proviene" readonly placeholder="Se toma del tipo de la persona">
  </mat-form-field>

  <mat-form-field appearance="outline" *ngIf="muestra('valor')">
    <mat-label>Valor</mat-label>
    <input matInput type="number" step="0.01" min="0" [(ngModel)]="valor">
  </mat-form-field>

  <mat-form-field appearance="outline" *ngIf="muestra('tipo')">
    <mat-label>Tipo</mat-label>
    <input matInput type="text" [(ngModel)]="tipo">
  </mat-form-field>

  <mat-form-field appearance="outline" *ngIf="muestra('fecha_evento')">
    <mat-label>Fecha</mat-label>
    <input matInput type="date" [(ngModel)]="fechaEvento">
  </mat-form-field>

  <mat-form-field appearance="outline" class="apoyo-motivo" *ngIf="muestra('autorizacion')">
    <mat-label>Autorización</mat-label>
    <textarea matInput rows="2" [(ngModel)]="autorizacion"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="apoyo-motivo" *ngIf="muestra('motivo')">
    <mat-label>Motivo</mat-label>
    <textarea matInput rows="2" [(ngModel)]="motivo"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="!valido">Guardar</button>
</mat-dialog-actions>
