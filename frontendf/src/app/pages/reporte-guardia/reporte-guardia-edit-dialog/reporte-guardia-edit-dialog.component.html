<h2 mat-dialog-title>Editar registro — {{ row.seccion }}</h2>

<mat-dialog-content>
  <!-- Solo los campos que usa esta sección, en SOLO LECTURA -->
  <div class="rg-grid">
    <div class="rg-f rg-col2" *ngFor="let c of campos">
      <label>{{ etiquetas[c] || c }}</label>
      <span>{{ mostrar(c) }}</span>
    </div>
  </div>

  <!-- Campos editables de la sección (p. ej. Autorización, Motivo) -->
  <mat-form-field appearance="outline" class="rg-motivo" *ngFor="let e of editables">
    <mat-label>{{ etiquetas[e] || e }}</mat-label>
    <textarea matInput rows="2" [(ngModel)]="valores[e]" [name]="e"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
